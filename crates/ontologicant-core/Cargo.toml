[package]
name = "ontologicant-core"
description = "OntologicAnt core: stable identifiers, relation types and provenance shared by the ontology tool crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
semanticant-core = "0.1.0"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# serde derives for the shared types, used by the other crates' `json` features
json = ["dep:serde"]

[lints]
workspace = true
