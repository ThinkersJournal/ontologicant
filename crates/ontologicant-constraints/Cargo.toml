[package]
name = "ontologicant-constraints"
description = "OntologicAnt constraints: disjointness, cardinality, domain and range, functional and inverse-functional checks over a graph and its taxonomy, each violation with reasons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ontologicant-core = { version = "=0.0.4", path = "../ontologicant-core" }
ontologicant-graph = { version = "=0.0.4", path = "../ontologicant-graph" }
ontologicant-kinds = { version = "=0.0.4", path = "../ontologicant-kinds" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# `to_json` / `from_json`
json = ["dep:serde", "dep:serde_json", "ontologicant-core/json"]

[lints]
workspace = true
