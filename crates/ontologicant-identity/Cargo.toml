[package]
name = "ontologicant-identity"
description = "OntologicAnt identity: aliases, canonical ids, equivalence classes with merge, split and undo over an append-only operation log, and pluggable matchers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ontologicant-core = { version = "=0.0.4", path = "../ontologicant-core" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# `to_json` / `from_json`
json = ["dep:serde", "dep:serde_json", "ontologicant-core/json"]

[lints]
workspace = true
