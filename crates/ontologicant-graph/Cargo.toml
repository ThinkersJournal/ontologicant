[package]
name = "ontologicant-graph"
description = "OntologicAnt relation graph: a labelled directed multigraph with stable ids and a documented text serialisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ontologicant-core = { version = "=0.0.3", path = "../ontologicant-core" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
petgraph = { version = "0.8.3", optional = true }

[features]
# `Graph::to_json` / `Graph::from_json`
# `Graph::to_petgraph` / `Graph::from_petgraph` interop with petgraph
petgraph = ["dep:petgraph"]
json = ["dep:serde", "dep:serde_json", "ontologicant-core/json"]

[lints]
workspace = true
