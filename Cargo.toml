[workspace]
resolver = "3"
members = ["crates/ontologicant-core", "crates/ontologicant-graph", "crates/ontologicant-kinds", "crates/ontologicant-identity"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/ontologicant"
authors = ["Eric Evans"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
