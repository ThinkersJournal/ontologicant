name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features --no-fail-fast

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  spdx:
    name: Every source file declares the licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Self-test the gate (it must be able to fail)
        run: bash .github/spdx_gate.sh --self-test
      - name: Every tracked source file declares the licence
        run: bash .github/spdx_gate.sh

  # Advisory (CireSnave 2026-10-23): not a required check, no rule silenced. Pinned to a commit on coderipper's main
  # (portfolio.yml last changed there; Cargo.toml says 0.47.12). Public repo: default GitHub-hosted runner.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@03d8ac318c9afe63bff67a165d447f406a96befe # 0.47.12
